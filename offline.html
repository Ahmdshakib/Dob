<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06142c"><title>DOB98 — Offline</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#142c50,#050b18 70%);color:#fff;font:16px Arial,sans-serif}.card{width:min(92%,460px);padding:34px 26px;text-align:center;border:1px solid #ffffff20;border-radius:22px;background:#0b1730;box-shadow:0 18px 70px #0008}.logo{font-size:35px;font-weight:900}.gold{color:#ffd34f}.symbol{font-size:54px;margin:20px 0}.muted{color:#b8c5d9;line-height:1.6}.btn{border:0;border-radius:10px;background:#ffd34f;color:#111827;font-weight:800;padding:13px 22px;margin-top:15px;cursor:pointer}.status{margin-top:16px;font-size:13px;color:#aebbd0}</style></head><body><main class="card"><div class="logo">DOB<span class="gold">98</span></div><div class="symbol">⌁</div><h1>You’re offline</h1><p class="muted">The server or internet connection could not be reached. Please reconnect and try again. Your account and transaction data have not been saved by this page.</p><button class="btn" onclick="location.href='index.html'">Try Again</button><div class="status" id="status">Checking connection…</div></main><script>function check(){document.getElementById('status').textContent=navigator.onLine?'Internet appears connected. If this page remains, the DOB98 server may still be offline.':'No internet connection detected.'}check();addEventListener('online',check);addEventListener('offline',check);</script></body></html>
